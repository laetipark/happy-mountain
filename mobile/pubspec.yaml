name: happy_mountain_mobile
description: 산등성이 — 주변 산, 날씨와 대형산불 경보 이력
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  http: 1.6.0
  geolocator: 14.0.3
  path_provider: 2.1.6
  cp949_codec: 1.0.2
  web: 1.1.1
  pointer_interceptor: 0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: Environment
      fonts:
        - asset: assets/fonts/environment_regular.ttf
        - asset: assets/fonts/environment_bold.ttf
          weight: 700

flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
